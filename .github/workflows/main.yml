name: Build Savio APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor Android
        run: |
          CAP_VERSION=$(node -p "require('./node_modules/@capacitor/core/package.json').version")
          npm install --no-save "@capacitor/android@$CAP_VERSION"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Remove Termux AAPT2 override
        run: sed -i '/android\.aapt2FromMavenOverride=/d' android/gradle.properties

      - name: Decode keystore
        run: echo "${{ secrets.SAVIO_KEYSTORE_BASE64 }}" | base64 -d > android/app/savio.keystore

      - name: Build APK
        working-directory: android
        env:
          SAVIO_KEYSTORE_PASSWORD: ${{ secrets.SAVIO_KEYSTORE_PASSWORD }}
          SAVIO_KEY_ALIAS: ${{ secrets.SAVIO_KEY_ALIAS }}
          SAVIO_KEY_PASSWORD: ${{ secrets.SAVIO_KEY_PASSWORD }}
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: savio-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
