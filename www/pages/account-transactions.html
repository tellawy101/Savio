<!-- =========================================
     ACCOUNT TRANSACTIONS PAGE
     صفحة عرض عمليات الحساب
     
     تعرض:
     - اسم الحساب
     - نوع العمليات (Income / Expense)
     - إجمالي العمليات
     - قائمة كل العمليات
     ========================================= -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>
    (function() {
        var lang = localStorage.getItem("language") || "en";
        var dir = lang === "ar" ? "rtl" : "ltr";
        document.documentElement.setAttribute("lang", lang);
        document.documentElement.setAttribute("dir", dir);
    })();
</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Account Transactions</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/account-transactions.css">
</head>

<body>

    <!-- Total -->
  <!-- =========================================
     ACCOUNT TOTAL HEADER
     Header + Total + Back Button
     ========================================= -->

<section class="total-card">
    
    <!-- الهيدر -->
    <div class="account-header">
        
        <!-- زر الرجوع -->
        <button class="back-btn" onclick="history.back()">
            ←
        </button>
        
        <!-- Income -->
        <div class="transaction-title">
            
            <h1 id="transactionType">
                Income
            </h1>    
            
        </div>
        
        <!-- الحساب -->
        <div class="account-info">
            
            <span id="accountName">
                Account
            </span>
            
            <span class="account-divider"></span>
            
            <span class="account-icon">
                🏦
            </span>
            
        </div>
        
    </div>
    
    
    <!-- الخط الفاصل -->
    <div class="header-divider"></div>
    
    
    <!-- إجمالي الدخل -->
    <div class="total-row">
        
        <div class="total-label" id="totalLabel">
            Total Income
        </div>
        
        <div class="total-value">
            
            <span class="currency">
                EGP
            </span>
            
            <span id="totalAmount">
                0.00
            </span>
            
        </div>
        
    </div>
    
</section>

    <!-- Transactions -->
    <section class="transactions-section">

        <div class="section-title">
            <h3 id="listTitle">Transactions</h3>
            <span id="transactionCount">0</span>
        </div>

        <ul id="transactionsList"></ul>

        <div id="emptyState" class="empty-state">
            <div>📭</div>
            <p data-i18n="no_transactions_yet">No transactions yet</p>
        </div>

    </section>

<script src="../js/vendor/lucide.js" defer></script>
<script src="../js/storage.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/accountTransactions.js"></script>
</body>
</html>
