<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Transfer</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/form-page.css">
    <link rel="stylesheet" href="../css/accounts.css">
    <link rel="stylesheet" href="../css/transfer.css">
</head>
<body class="has-scroll">
    <!-- رأس الصفحة -->
    <header class="transfer-header">

        <button id="backBtn" class="back-btn">←</button>

        <h1>Transfer</h1>

        <button id="saveTransferBtn" class="save-btn">✓</button>

    </header>

    <!-- محتوى الصفحة -->
    <main class="transfer-content">

        <div class="amount-section">

            <div class="amount-display">
                <span class="currency">EGP</span>

                <input
                    type="tel"
                    id="transferAmount"
                    inputmode="numeric"
                    value="0">
            </div>

        </div>

        <div class="form-group">

            <label>From Account</label>

            <div class="account-select-box">

                <span class="account-icon">💳</span>

                <div id="transferFromAccount" class="account-select">
                    Select Account
                </div>

                <span class="account-arrow">›</span>

            </div>

        </div>

        <div class="transfer-swap-row">
            <button id="swapAccountsBtn" type="button" class="swap-accounts-btn">
                <i data-lucide="arrow-down-up"></i>
            </button>
        </div>

        <div class="form-group">

            <label>To Account</label>

            <div class="account-select-box">

                <span class="account-icon">💳</span>

                <div id="transferToAccount" class="account-select">
                    Select Account
                </div>

                <span class="account-arrow">›</span>

            </div>

        </div>

        <div class="form-group">

            <label>Description</label>

            <div class="description-box">

                <input
                    type="text"
                    id="transferDescription"
                    class="description-input"
                    placeholder="Write a note">

            </div>

        </div>

        <div class="form-group">
            <label>Date</label>
            <div class="description-box">
                <input
                    type="date"
                    id="transferDate"
                    class="description-input">
            </div>
        </div>

    </main>

    <div id="modals-placeholder"></div>

<script src="../js/components.js"></script>
<script>
    document.getElementById("modals-placeholder").innerHTML = renderSharedModals();
</script>
<script src="../js/storage.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/formHelpers.js"></script>
<script src="../js/vendor/lucide.js" defer></script>
<script src="../js/accounts.js"></script>
<script src="../js/transfer.js"></script>
<script>
    if (window.lucide) lucide.createIcons();
</script>
</body>
</html>
