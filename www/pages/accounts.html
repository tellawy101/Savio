<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <script>
    (function() {
        var lang = localStorage.getItem("language") || "en";
        var dir = lang === "ar" ? "rtl" : "ltr";
        document.documentElement.setAttribute("lang", lang);
        document.documentElement.setAttribute("dir", dir);
    })();
</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Accounts</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/form-page.css">
    <link rel="stylesheet" href="../css/accounts.css">
</head>

<body>

<header class="page-header">

    <button id="backBtn" class="back-btn">←</button>

    <h2>Accounts</h2>


</header>

<div id="accountsContainer"></div>
<div id="modals-placeholder"></div>
<div id="nav-placeholder"></div>
<script src="../js/components.js"></script>
<script>
    document.getElementById("modals-placeholder").innerHTML = renderSharedModals();
    document.getElementById("nav-placeholder").innerHTML = renderBottomNav('accounts');
    setupBottomNav('../');
    document.querySelector(".bottom-nav").insertAdjacentHTML("beforeend", `
    <button id="openAddAccountBtn" class="fab-nav">
        <i data-lucide="plus"></i>
    </button>
`);
</script>
<script src="../js/vendor/lucide.js" defer></script>


<script src="../js/storage.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/formHelpers.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/accounts.js"></script>
<script src="../js/accountsPage.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        initIcons();
    });
</script>
</body>
</html>
