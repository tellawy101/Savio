<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Debts</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/debts.css">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>

<body>


<div class="balance-card">
    
   <h3>Net Balance</h3>
    
    <h1 id="netBalance">
    <span class="currency">EGP</span>
    <span class="amount">0</span>
</h1>
    
    <div class="balance-grid">
        
       <div class="stat receivable">

    <span>↗</span>

    <h4>Receivable</h4>

    <p id="totalReceivable">EGP 0</p>

</div>
        
       <div class="stat payable">
            
            <span>↘</span>
            
            <h4>Payable</h4>
            
            <p id="totalPayable">EGP 0</p>
            
        </div>
        
    </div>
    
</div>

<div class="debts-header">

    <h3>Debts List</h3>

    <button id="addDebtBtn" class="add-debt-btn">
        + Add Debt
    </button>

</div>

<div id="debtsList" class="debts-list">
</div>
<!-- Debt Modal -->
<div id="debtModal" class="modal">

    <div class="modal-content">

        <h2>Add New Debt</h2>

       <div class="debt-type-buttons">

    <button type="button" class="debt-type-btn active" data-type="receivable">
        Owed to Me
    </button>

    <button type="button" class="debt-type-btn" data-type="payable">
        I Owe
    </button>

</div>

<select id="debtType" style="display:none;">
    <option value="receivable">Owed to Me</option>
    <option value="payable">I Owe</option>
</select>

        <input
            type="text"
            id="debtPerson"
            placeholder="Person Name">

        <input
            type="tel"
            id="debtAmount"
            placeholder="Amount">

        <input
            type="date"
            id="debtDueDate">

        <textarea
            id="debtNotes"
            placeholder="Notes (Optional)"></textarea>

        <div class="modal-actions">

            <button id="cancelDebtBtn">
                Cancel
            </button>

            <button id="saveDebtBtn">
                Save
            </button>

        </div>

    </div>

</div>
<!-- Pay Modal -->
<div id="payDebtModal" class="modal">

    <div class="modal-content">

        <h2>Pay Debt</h2>

        <select id="payAccount">
            <option value="">Select Account</option>
        </select>

        <input
            type="tel"
            id="payAmount"
            placeholder="Amount">

        <div class="modal-actions">

            <button id="cancelPayBtn">
                Cancel
            </button>

            <button id="confirmPayBtn">
                Confirm
            </button>

        </div>

    </div>

</div>
<!-- Edit Debt Modal -->
<div id="editDebtModal" class="modal">

    <div class="modal-content">

        <h2>Edit Debt</h2>

        <div class="debt-type-buttons">

            <button type="button" class="edit-debt-type-btn active" data-type="receivable">
                Owed to Me
            </button>

            <button type="button" class="edit-debt-type-btn" data-type="payable">
                I Owe
            </button>

        </div>

        <input
            type="text"
            id="editDebtPerson"
            placeholder="Person Name">

        <input
            type="tel"
            id="editDebtAmount"
            placeholder="Amount">

        <input
            type="date"
            id="editDebtDueDate">

        <textarea
            id="editDebtNotes"
            placeholder="Notes (Optional)"></textarea>

        <div class="modal-actions">

            <button id="cancelEditDebtBtn">
                Cancel
            </button>

            <button id="saveEditDebtBtn">
                Save
            </button>

        </div>

    </div>

</div>

<div id="toast" class="toast"></div>


<div id="nav-placeholder"></div>
<script src="../js/components.js"></script>
<script>
    document.getElementById("nav-placeholder").innerHTML = renderBottomNav('debts');
    setupBottomNav('../');
</script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

<script src="../js/storage.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/debts.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        initIcons();
    });
</script>
</body>
</html>
