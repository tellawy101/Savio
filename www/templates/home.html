<div class="home-top">
    <div class="home-top-actions">
        <button id="budgetBtn" class="budget-btn">
            <i data-lucide="wallet"></i>
            <span id="budgetValue">TEST123</span>
        </button>
        <div class="month-nav home-month-nav">
            <button id="monthLabelBtn" class="month-label-btn"></button>
            <input type="month" id="monthPicker" class="month-picker-input">
        </div>
    </div>
    <div id="homeReport"></div>
</div>
<main>
<!-- Budget Modal -->
<div id="budgetModal" class="modal">

    <div class="modal-content budget-modal-content">

        <div class="budget-modal-header">
            <div class="budget-modal-icon">
                <i data-lucide="wallet"></i>
            </div>
            <h2 data-i18n="budget">Budget</h2>
            <button id="closeBudgetBtn" class="budget-modal-close" aria-label="Close">
                <i data-lucide="x"></i>
            </button>
        </div>

        <label for="budgetAmount" data-i18n="monthly_budget">
            Monthly Budget
        </label>

        <div class="budget-input-wrap">
<span class="budget-input-currency"></span>
            <input
                type="text"
                id="budgetAmount"
                inputmode="decimal"
                placeholder="0">
        </div>

        <button id="saveBudgetBtn" class="budget-save-btn" data-i18n="save">
            Save
        </button>

    </div>

</div>


     <div class="expenses-section">

   <div class="expenses-header">
   <h2 data-i18n="expenses_title">Expenses</h2>
   
    <button id="searchBtn" class="search-btn">
        <i data-lucide="search"></i>
    </button>
   <div id="searchPanel" class="search-panel">
    <input
        type="text"
        id="searchInput"
        placeholder="Search by category, description, or account..."
        data-i18n-placeholder="search_placeholder">
    <div class="filters-row">
        <select id="accountFilter" class="filter-select"></select>
                <select id="categoryFilter" class="filter-select"></select>
    </div>
        <div class="filters-row">
        <select id="sortFilter" class="filter-select"></select>
                <select id="typeFilter" class="filter-select"></select>
    </div>
        <div id="filterSummary" class="filter-summary" style="display: none;">
        <span id="filterCount"></span>
        <button id="clearFiltersBtn" class="filter-clear-btn" type="button" data-i18n="filter_clear">Clear filters</button>
    </div>
   </div>

</div>

    <ul id="expenseList"></ul>

</div>

</main>

<div id="modals-placeholder"></div>
