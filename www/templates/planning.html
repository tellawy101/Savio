<main class="settings-page">
<div class="sub-page-header">
  <button type="button" class="back-btn" data-back="settings">←</button>
  <h3 data-i18n="settings_planning">Financial Planning</h3>
</div>
  <section class="settings-section">
    <div class="settings-card">

      <div class="settings-item" id="goalsBtn">
        <div class="settings-icon">
          <i data-lucide="target"></i>
        </div>
        <div class="settings-info">
          <span data-i18n="goals_title">Savings Goals</span>
          <small data-i18n="goals_settings_desc">Set and track your savings goals</small>
        </div>
        <i class="settings-arrow" data-lucide="chevron-right"></i>
      </div>

      <div class="settings-divider"></div>

      <div class="settings-item" id="recurringBtn">
        <div class="settings-icon">
          <i data-lucide="repeat"></i>
        </div>
        <div class="settings-info">
          <span data-i18n="recurring_title">Recurring Transactions</span>
          <small data-i18n="recurring_settings_desc">Add salary, rent or bills automatically</small>
        </div>
        <i class="settings-arrow" data-lucide="chevron-right"></i>
      </div>

      <div class="settings-divider"></div>

      <div class="settings-item" id="catBudgetsBtn">
        <div class="settings-icon">
          <i data-lucide="wallet"></i>
        </div>
        <div class="settings-info">
          <span data-i18n="cb_title">Category Budgets</span>
          <small data-i18n="cb_settings_desc">Set a monthly limit for each category</small>
        </div>
        <i class="settings-arrow" data-lucide="chevron-right"></i>
      </div>

    </div>
  </section>

</main>

<div id="modals-placeholder"></div>
