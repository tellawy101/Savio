<section class="total-card">

    <div class="account-header">

        <button id="backBtn" class="back-btn">←</button>

        <div class="transaction-title">
            <h1 id="transactionType">Income</h1>
        </div>

        <div class="account-info">
            <span id="accountName">Account</span>
            <span class="account-divider"></span>
            <span class="acc-header-icon">🏦</span>
        </div>

    </div>

    <div class="header-divider"></div>

    <div class="total-row">
        <div class="total-label" id="totalLabel">Total Income</div>
        <div class="total-value">
            <span class="currency">EGP</span>
            <span id="totalAmount">0.00</span>
        </div>
    </div>

</section>

<section class="transactions-section">

    <div class="section-title">
        <h3 id="listTitle">Transactions</h3>
        <span id="transactionCount">0</span>
    </div>

    <ul id="transactionsList"></ul>

    <div id="emptyState" class="empty-state">
        <div>📭</div>
        <p data-i18n="no_transactions_yet">No transactions yet</p>
    </div>

</section>
