<div class="balance-card">

   <h3 data-i18n="debts_net_balance">Net Balance</h3>

    <h1 id="netBalance">
    <span class="currency">EGP</span>
    <span class="amount">0</span>
</h1>

    <div class="balance-grid">
    
    <div class="stat receivable">
        
        <i data-lucide="trending-up"></i>
        
        <h4 data-i18n="debts_receivable">Receivable</h4>
        
        <p id="totalReceivable"><span class="stat-currency">EGP</span> <span class="stat-value">0</span></p>
        
    </div>
    
    <div class="stat payable">
        
        <i data-lucide="trending-down"></i>
        
        <h4 data-i18n="debts_payable">Payable</h4>
        
        <p id="totalPayable"><span class="stat-currency">EGP</span> <span class="stat-value">0</span></p>
        
    </div>
    
</div>

</div>

<div class="debts-header">

    <h3 data-i18n="debts_list_title">Debts List</h3>

  <button id="addDebtBtn" class="add-debt-btn" data-i18n="debts_add_btn">
    + Add Debt
</button>

</div>

<div id="debtsList" class="debts-list">
</div>
<!-- Debt Modal -->
<div id="debtModal" class="modal">
    
    <div class="modal-content budget-modal-content">
        
        <div class="budget-modal-header">
            <div class="budget-modal-icon">
                <i data-lucide="hand-coins"></i>
            </div>
            <h2 data-i18n="debts_add_title">Add New Debt</h2>
            <button id="cancelDebtBtn" class="budget-modal-close" aria-label="Close">
                <i data-lucide="x"></i>
            </button>
        </div>
        
        <div class="debt-type-buttons">
            <button type="button" class="debt-type-btn active" data-type="receivable" data-i18n="debts_owed_to_me">Owed to Me</button>
            <button type="button" class="debt-type-btn" data-type="payable" data-i18n="debts_i_owe">I Owe</button>
        </div>
        
        <select id="debtType" style="display:none;">
            <option value="receivable">Owed to Me</option>
            <option value="payable">I Owe</option>
        </select>
        
        <div class="goal-field">
            <label for="debtPerson" data-i18n="debts_person_placeholder">Person Name</label>
            <input type="text" id="debtPerson">
        </div>
        
        <div class="goal-field">
            <label for="debtAmount" data-i18n="debts_amount_placeholder">Amount</label>
            <input type="tel" id="debtAmount" placeholder="0">
        </div>
        
        <div class="goal-field">
            <label for="debtDueDate" data-i18n="debts_due_date_label">Due date</label>
            <div class="date-wrap">
                <input type="text" id="debtDueDateText" class="date-visible" readonly>
                <input type="date" id="debtDueDate" class="date-native">
            </div>
        </div>
        
        <div class="goal-field">
            <label for="debtNotes" data-i18n="debts_notes_placeholder">Notes (Optional)</label>
            <textarea id="debtNotes"></textarea>
        </div>
        
        <button id="saveDebtBtn" class="budget-save-btn" data-i18n="save">Save</button>
        
    </div>
    
</div>
<!-- Pay Modal -->
<div id="payDebtModal" class="modal">

    <div class="modal-content">

       <h2 data-i18n="debts_pay_title">Pay Debt</h2>

       <select id="payAccount">
    <option value="" data-i18n="select_account">Select Account</option>
</select>

    <input type="tel" id="payAmount" placeholder="Amount" data-i18n-placeholder="debts_amount_placeholder">

        <div class="modal-actions">

           <button id="cancelPayBtn" data-i18n="cancel">Cancel</button>
<button id="confirmPayBtn" data-i18n="confirm_btn">Confirm</button>

        </div>

    </div>

</div>
<!-- Payments History Modal -->
<div id="paymentsHistoryModal" class="modal">

    <div class="modal-content">

        <h2 id="paymentsHistoryTitle" data-i18n="debts_history_title">Payments History</h2>

        <div id="paymentsHistoryList" class="payments-history-list"></div>

        <div class="modal-actions">
            <button id="closePaymentsHistoryBtn" data-i18n="debts_history_close">Close</button>
        </div>

    </div>

</div>

<!-- Edit Debt Modal -->
<div id="editDebtModal" class="modal">
    
    <div class="modal-content budget-modal-content">
        
        <div class="budget-modal-header">
            <div class="budget-modal-icon">
                <i data-lucide="pencil"></i>
            </div>
            <h2 data-i18n="debts_edit_title">Edit Debt</h2>
            <button id="cancelEditDebtBtn" class="budget-modal-close" aria-label="Close">
                <i data-lucide="x"></i>
            </button>
        </div>
        
        <div class="debt-type-buttons">
            <button type="button" class="edit-debt-type-btn active" data-type="receivable" data-i18n="debts_owed_to_me">Owed to Me</button>
            <button type="button" class="edit-debt-type-btn" data-type="payable" data-i18n="debts_i_owe">I Owe</button>
        </div>
        
        <div class="goal-field">
            <label for="editDebtPerson" data-i18n="debts_person_placeholder">Person Name</label>
            <input type="text" id="editDebtPerson">
        </div>
        
        <div class="goal-field">
            <label for="editDebtAmount" data-i18n="debts_amount_placeholder">Amount</label>
            <input type="tel" id="editDebtAmount" placeholder="0">
        </div>
        
        <div class="goal-field">
            <label for="editDebtDueDate" data-i18n="debts_due_date_label">Due date</label>
            <div class="date-wrap">
                <input type="text" id="editDebtDueDateText" class="date-visible" readonly>
                <input type="date" id="editDebtDueDate" class="date-native">
            </div>
        </div>
        
        <div class="goal-field">
            <label for="editDebtNotes" data-i18n="debts_notes_placeholder">Notes (Optional)</label>
            <textarea id="editDebtNotes"></textarea>
        </div>
        
        <button id="saveEditDebtBtn" class="budget-save-btn" data-i18n="save">Save</button>
        
    </div>
    
</div>
<div id="modals-placeholder"></div>
