<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Savio</title>

    <!-- خط Inter (أقرب بديل ويب لـ SF Pro بتاع آيفون) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- مكتبة أيقونات Lucide -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/form-page.css">
<link rel="stylesheet" href="css/income.css">
  <link rel="stylesheet" href="css/expense.css">
<link rel="stylesheet" href="css/settings.css">
<link rel="stylesheet" href="css/statistics.css">
</head>

<body>
<header class="dashboard">
  <button id="themeBtn"><span id="themeIconWrap"><i data-lucide="moon"></i></span></button>
  <button id="budgetBtn" class="budget-btn">
    <i data-lucide="wallet"></i>
    <span id="budgetValue">Budget</span>
</button>
   <div class="balance-box">
    <h3>Balance</h3>
    <h2 class="balance-amount">
        <span class="balance-currency">EGP</span>
        <span id="balanceValue">0</span>
    </h2>
</div>
<!-- Balance Chart -->
<div class="balance-chart">
    <svg viewBox="0 0 700 120" preserveAspectRatio="none">
<line x1="0" y1="20" x2="700" y2="20"></line>
<line x1="0" y1="50" x2="700" y2="50"></line>
<line x1="0" y1="80" x2="700" y2="80"></line>
        <!-- الرسم -->
       <path
    id="chartArea"
    class="chart-area">
</path>

<path
    id="chartLine"
    class="chart-line">
</path>

    </svg>

    <div class="chart-days">
    <span id="day0"></span>
    <span id="day1"></span>
    <span id="day2"></span>
    <span id="day3"></span>
    <span id="day4"></span>
    <span id="day5"></span>
    <span id="day6"></span>
</div>
</div>
    <div class="stats">

        <div class="stat">
            <span><i data-lucide="trending-up"></i></span>
            <h4>Income</h4>
            <p id="totalIncome">EGP 0.00</p>
        </div>

        <div class="stat">
            <span><i data-lucide="trending-down"></i></span>
            <h4>Expenses</h4>
            <p id="totalExpense">EGP 0.00</p>
        </div>

    </div>

</header>
<main>
    <!-- Budget Modal -->
<div id="budgetModal" class="modal">

    <div class="modal-content">

        <h2>Budget</h2>

        <label for="budgetAmount">
            Monthly Budget
        </label>

        <input
            type="text"
            id="budgetAmount"
            inputmode="decimal"
            placeholder="0">
<div class="budget-actions">
    
    <button id="saveBudgetBtn">
        Save
    </button>
    
    <button id="closeBudgetBtn">
        Cancel
    </button>
    
</div>

    </div>

</div>
 
  <!-- نافذة إضافة الدخل -->
<div id="incomeModal" class="modal">
    <div class="modal-content">
        <h2 class="income-title">Income</h2>
        <label>Account</label>

<select id="incomeAccount">
</select>

<label>Description</label>

<input
    type="text"
    id="incomeDescription"
    placeholder="Description">

<label>Date</label>

<input
    type="date"
    id="incomeDate">

<label>Amount</label>

<input
    type="text"
    id="incomeAmount"
    inputmode="numeric"
    placeholder="0">
        <select id="incomeCategory">
        </select>

        <button id="saveIncomeBtn">Save</button>
        <button id="closeIncomeBtn">Cancel</button>

    </div>
</div>

<!-- نافذة إضافة التصنيف -->
<div id="categoryModal" class="modal">
    <div class="modal-content">

        <h2><i data-lucide="tag"></i> Add Category</h2>

        <input
            type="text"
            id="newCategoryName"
            placeholder="Category Name">

        <input
            type="text"
            id="newCategoryIcon"
            placeholder="😀 Icon"
            maxlength="2">

        <button id="saveCategoryBtn">Save</button>
        <button id="closeCategoryBtn">Cancel</button>

    </div>
    </div>
     <div class="expenses-section">

    <div class="expenses-header">
        <h2>Expenses</h2>

        <button id="searchBtn" class="search-btn">
            <i data-lucide="search"></i>
        </button>
         <input
        type="text"
        id="searchInput"
        placeholder="Search by category...">

    </div>

    <ul id="expenseList"></ul>

</div>
</main>
<div id="nav-placeholder"></div>
<script src="js/components.js"></script>
<script>
    document.getElementById("nav-placeholder").innerHTML = renderBottomNav('home');
    setupBottomNav('');
</script>
<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script src="js/theme.js"></script>
<script src="js/search.js"></script>
<script src="js/statistics.js"></script>
<script src="js/script.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        initIcons();
    });
</script>
</body>
</html>
