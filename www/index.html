<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>
        (function () {
            var lang = localStorage.getItem("language") || "en";
            var dir = lang === "ar" ? "rtl" : "ltr";
            document.documentElement.setAttribute("lang", lang);
            document.documentElement.setAttribute("dir", dir);
        })();
    </script>
   <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Savio</title>
    
    <!-- مكتبة أيقونات Lucide -->
    <script src="js/vendor/lucide.js" defer></script>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/form-page.css">
<link rel="stylesheet" href="css/transaction-pages.css">
<link rel="stylesheet" href="css/settings.css">
<link rel="stylesheet" href="css/statistics.css?v=2">
<link rel="stylesheet" href="css/accounts.css?v=2">
<link rel="stylesheet" href="css/debts.css">
<link rel="stylesheet" href="css/account-transactions.css">
<link rel="stylesheet" href="css/login-screen.css">
</head>
<body>
<div id="app">

</div>
<div id="toast" class="toast"></div>
<div id="nav-placeholder"></div>

<!-- شاشة تسجيل الدخول (صفحة كاملة) -->
<div id="loginPromptScreen" class="login-screen show">
      <button type="button" id="loginLangToggleBtn" class="login-lang-toggle" aria-label="Language">
        <i data-lucide="languages"></i>
    </button>
    <div class="login-screen-inner">
        <div class="login-screen-icon">
            <i data-lucide="wallet"></i>
        </div>
        <h1 class="login-screen-title" data-i18n="login_prompt_title">Sign in</h1>
        <p class="login-screen-desc" data-i18n="login_prompt_desc">Keep your data backed up and synced safely on the cloud.</p>

        <div class="login-input-wrap">
            <i data-lucide="mail" class="login-input-icon"></i>
            <input type="email" id="loginEmailInput" class="login-input" data-i18n-placeholder="login_prompt_email_placeholder" placeholder="Email">
        </div>

        <div class="login-input-wrap">
            <input type="password" id="loginPasswordInput" class="login-input" data-i18n-placeholder="login_prompt_password_placeholder" placeholder="Password">
            <i data-lucide="eye" class="login-input-icon login-password-toggle" id="loginPasswordToggle"></i>
        </div>

        <div class="login-strength-wrap">
            <div class="login-strength-header">
                <span data-i18n="login_prompt_strength_label">Password strength</span>
                <span id="loginStrengthLabel">-</span>
            </div>
            <div class="login-strength-bar">
                <div class="login-strength-bar-fill" id="loginStrengthBarFill"></div>
            </div>
            <div class="login-strength-checks">
                <div class="login-strength-check" data-rule="length">
                    <span class="login-strength-dot"></span>
                    <span data-i18n="login_prompt_strength_length">8 chars</span>
                </div>
                <div class="login-strength-check" data-rule="upper">
                    <span class="login-strength-dot"></span>
                    <span>A-Z</span>
                </div>
                <div class="login-strength-check" data-rule="lower">
                    <span class="login-strength-dot"></span>
                    <span>a-z</span>
                </div>
                <div class="login-strength-check" data-rule="digit">
                    <span class="login-strength-dot"></span>
                    <span>123</span>
                </div>
                <div class="login-strength-check" data-rule="special">
                    <span class="login-strength-dot"></span>
                    <span>$#@</span>
                </div>
            </div>
        </div>

        <button id="loginPromptSignInBtn" class="login-btn-primary" data-i18n="login_prompt_signin">Sign in</button>
        <button id="loginPromptSignUpBtn" class="login-btn-outline" data-i18n="login_prompt_signup">Create account</button>
        <button id="loginPromptSkipBtn" class="login-skip-link" data-i18n="login_prompt_skip">Skip for now</button>
    </div>
</div>
<script type="module" src="js/firebase-init.js"></script>
<script src="js/components.js"></script>
<script>
    document.getElementById("nav-placeholder").innerHTML = renderBottomNav('home');
    setupBottomNav('');
</script>
<script src="js/i18n.js"></script>
<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script src="js/theme.js"></script>
<script src="js/formHelpers.js"></script>
<script src="js/transactionCommon.js"></script>
<script src="js/category.js"></script>
<script src="js/accounts.js"></script>
<script src="js/transactionForm.js"></script>
<script src="js/transfer.js"></script>
<script src="js/screens/homePage.js"></script>
<script src="js/router.js"></script>
<script src="js/screens/settingsPage.js"></script>
<script src="js/screens/accountsPage.js"></script>
<script src="js/screens/debtsPage.js"></script>
<script src="js/statisticsLogic.js"></script>
<script src="js/screens/statisticsPage.js?v=2"></script>
<script src="js/screens/addTransactionPage.js"></script>
<script src="js/screens/accountTransactionsPage.js"></script>
<script src="js/authUI.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        initIcons();
        navigateTo("home");
        initLoginPrompt();
    });
</script>
</body>
</html>
