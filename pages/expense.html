<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/form-page.css">
    <link rel="stylesheet" href="../css/expense.css">
</head>
<body class="has-scroll">
    <!-- رأس الصفحة -->
 <header class="expense-header">

    <button id="backBtn" class="back-btn">←</button>

    <h1>Expense</h1>

    <button id="saveExpenseBtn" class="save-btn">✓</button>

</header>
    
    <!-- محتوى الصفحة -->
    <main class="expense-content">
    
<div class="amount-section">

    <div class="amount-display">
    <span class="currency">EGP</span>

    <input
        type="tel"
       id="expenseAmount"
        inputmode="numeric"
        value="0">
</div>

</div>

<div class="form-group">

    <label>Account</label>

    <div class="account-select-box">

        <span class="account-icon">💳</span>

       <div id="expenseAccount" class="account-select">
    Select Account
</div>
        <span class="account-arrow">›</span>

    </div>
    

</div>
<div class="form-group">
    <label>Category</label>
    <div class="category-select-box">
        <span class="category-icon">🏷️</span>
     <div id="expenseCategory" class="category-select">
    Select Category
</div>
        <span class="category-arrow">›</span>
    </div>
</div>

<div class="form-group">

    <label>Description</label>

    
    <div class="description-box">

        <input
            type="text"
            id="expenseDescription"
            class="description-input"
            placeholder="Write a note">

    </div>

</div>

<div class="form-group">
    <label>Date</label>
   <div class="description-box">
    <input
        type="date"
       id="expenseDate"
        class="description-input"
        placeholder="Write the date">
</div>
</div>

    </main>
<div id="modals-placeholder"></div>
<script src="../js/components.js"></script>
<script>
    document.getElementById("modals-placeholder").innerHTML = renderSharedModals();
</script>
<script src="../js/storage.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/search.js"></script>
<script src="../js/formHelpers.js"></script>
<script src="../js/accounts.js"></script>
<script src="../js/expense.js"></script>
</body>
</html>
