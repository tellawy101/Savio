<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debts</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/debts.css">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>

<body>


<div class="balance-card">
    
   <h3>Net Balance</h3>
    
    <h1 id="netBalance">
    <span class="currency">EGP</span>
    <span class="amount">0</span>
</h1>
    
    <div class="balance-grid">
        
       <div class="stat receivable">

    <span>↗</span>

    <h4>Receivable</h4>

    <p id="totalReceivable">EGP 0</p>

</div>
        
       <div class="stat payable">
            
            <span>↘</span>
            
            <h4>Payable</h4>
            
            <p id="totalPayable">EGP 0</p>
            
        </div>
        
    </div>
    
</div>

<div class="debts-header">

    <h3>Debts List</h3>

    <button id="addDebtBtn" class="add-debt-btn">
        + Add Debt
    </button>

</div>

<div id="debtsList" class="debts-list">
</div>
<!-- Debt Modal -->
<div id="debtModal" class="modal">

    <div class="modal-content">

        <h2>Add New Debt</h2>

       <div class="debt-type-buttons">

    <button type="button" class="debt-type-btn active" data-type="receivable">
        Owed to Me
    </button>

    <button type="button" class="debt-type-btn" data-type="payable">
        I Owe
    </button>

</div>

<select id="debtType" style="display:none;">
    <option value="receivable">Owed to Me</option>
    <option value="payable">I Owe</option>
</select>

        <input
            type="text"
            id="debtPerson"
            placeholder="Person Name">

        <input
            type="tel"
            id="debtAmount"
            placeholder="Amount">

        <input
            type="date"
            id="debtDueDate">

        <textarea
            id="debtNotes"
            placeholder="Notes (Optional)"></textarea>

        <div class="modal-actions">

            <button id="cancelDebtBtn">
                Cancel
            </button>

            <button id="saveDebtBtn">
                Save
            </button>

        </div>

    </div>

</div>
<div id="toast" class="toast"></div>
<!-- Edit Debt Modal -->
<div id="editDebtModal" class="modal">

    <div class="modal-content">

        <h2>Edit Debt</h2>

        <div class="debt-type-buttons">

            <button type="button"
                    class="edit-debt-type-btn active"
                    data-type="receivable">
                Owed to Me
            </button>

            <button type="button"
                    class="edit-debt-type-btn"
                    data-type="payable">
                I Owe
            </button>

        </div>

        <input
            type="text"
            id="editDebtPerson"
            placeholder="Person Name">

        <input
            type="number"
            id="editDebtAmount"
            placeholder="Amount">

        <input
            type="date"
            id="editDebtDueDate">

        <textarea
            id="editDebtNotes"
            placeholder="Notes (Optional)"></textarea>

        <div class="modal-actions">

            <button id="cancelEditDebtBtn">
                Cancel
            </button>

            <button id="saveEditDebtBtn">
                Save Changes
            </button>

        </div>

    </div>

</div>
<nav class="bottom-nav no-fab">

    <button class="nav-item" onclick="window.location.href='../index.html'">
        <i data-lucide="home"></i>
        <span>Home</span>
    </button>

    <button id="settingsNavBtn" class="nav-item">
        <i data-lucide="hand-coins"></i>
        <span>Debts</span>
    </button>

   <button id="accountsBtn" class="nav-item">
    <i data-lucide="wallet"></i>
    <span>Accounts</span>
</button>

    <button id="settingsBtn" class="nav-item">
    <i data-lucide="settings"></i>
    <span>Settings</span>
</button>

</nav>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

<script src="../js/storage.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/debts.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {
    lucide.createIcons();
});
</script>
<script>
function navigateWithAnimation(button, url) {

    const nav = button.closest(".bottom-nav");
    const current = nav.querySelector(".nav-item.active");

    if (current && current !== button) {
        current.classList.remove("active");
    }

    button.classList.add("active");

    setTimeout(() => {
        window.location.href = url;
    }, 400);
}

document.getElementById("accountsBtn").onclick = function () {
    navigateWithAnimation(this, "accounts.html");
};

document.getElementById("settingsBtn").onclick = function () {
    navigateWithAnimation(this, "settings.html");
};
</script>
</body>
</html>
