<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debts</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/debts.css">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>

<body>


<div class="balance-card">
    
   <h3>Net Balance</h3>
    
    <h1 id="netBalance">EGP 0</h1>
    
    <div class="balance-grid">
        
       <div class="stat receivable">

    <span>↗</span>

    <h4>Receivable</h4>

    <p id="totalReceivable">EGP 0</p>

</div>
        
       <div class="stat payable">
            
            <span>↘</span>
            
            <h4>Payable</h4>
            
            <p id="totalPayable">EGP 0</p>
            
        </div>
        
    </div>
    
</div>

<div class="debts-header">

    <h3>Debts List</h3>

    <button id="addDebtBtn" class="add-debt-btn">
        + Add Debt
    </button>

</div>

<div id="debtsList" class="debts-list">
</div>
<!-- Debt Modal -->
<div id="debtModal" class="modal">

    <div class="modal-content">

        <h2>Add New Debt</h2>

        <select id="debtType">
            <option value="receivable">💰 Money Owed To Me</option>
            <option value="payable">💸 Money I Owe</option>
        </select>

        <input
            type="text"
            id="debtPerson"
            placeholder="Person Name">

        <input
            type="tel"
            id="debtAmount"
            placeholder="Amount">

        <input
            type="date"
            id="debtDueDate">

        <textarea
            id="debtNotes"
            placeholder="Notes (Optional)"></textarea>

        <div class="modal-actions">

            <button id="cancelDebtBtn">
                Cancel
            </button>

            <button id="saveDebtBtn">
                Save
            </button>

        </div>

    </div>

</div>
<div id="toast" class="toast"></div>
<script src="../js/storage.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/debts.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
    lucide.createIcons();
});
</script>
</body>
</html>
