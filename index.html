<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Savio</title>

    <!-- خط Inter (أقرب بديل ويب لـ SF Pro بتاع آيفون) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- مكتبة أيقونات Lucide -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>

    <link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/income.css">
  <link rel="stylesheet" href="css/expense.css">
<link rel="stylesheet" href="css/settings.css">
<link rel="stylesheet" href="css/statistics.css">
</head>

<body>
<header class="dashboard">
  <button id="themeBtn"><span id="themeIconWrap"><i data-lucide="moon"></i></span></button>
   <div class="balance-box">
    <h3>Balance</h3>
    <h2 class="balance-amount">
        <span class="balance-currency">EGP</span>
        <span id="balanceValue">0</span>
    </h2>
</div>

    <div class="stats">

        <div class="stat">
            <span><i data-lucide="trending-up"></i></span>
            <h4>Income</h4>
            <p id="totalIncome">EGP 0.00</p>
        </div>

        <div class="stat">
            <span><i data-lucide="trending-down"></i></span>
            <h4>Expenses</h4>
            <p id="totalExpense">EGP 0.00</p>
        </div>

    </div>

</header>
<main>
 
  <!-- نافذة إضافة الدخل -->
<div id="incomeModal" class="modal">
    <div class="modal-content">
        <h2 class="income-title">Income</h2>
        <label>Account</label>

<select id="incomeAccount">
</select>

<label>Description</label>

<input
    type="text"
    id="incomeDescription"
    placeholder="Description">

<label>Date</label>

<input
    type="date"
    id="incomeDate">

<label>Amount</label>

<input
    type="text"
    id="incomeAmount"
    inputmode="numeric"
    placeholder="0">
        <select id="incomeCategory">
        </select>

        <button id="saveIncomeBtn">Save</button>
        <button id="closeIncomeBtn">Cancel</button>

    </div>
</div>

<!-- نافذة إضافة التصنيف -->
<div id="categoryModal" class="modal">
    <div class="modal-content">

        <h2><i data-lucide="tag"></i> Add Category</h2>

        <input
            type="text"
            id="newCategoryName"
            placeholder="Category Name">

        <input
            type="text"
            id="newCategoryIcon"
            placeholder="😀 Icon"
            maxlength="2">

        <button id="saveCategoryBtn">Save</button>
        <button id="closeCategoryBtn">Cancel</button>

    </div>
    </div>
     <div class="expenses-section">

    <div class="expenses-header">
        <h2>Expenses</h2>

        <button id="searchBtn" class="search-btn">
            <i data-lucide="search"></i>
        </button>
         <input
        type="text"
        id="searchInput"
        placeholder="Search by category...">

    </div>

    <ul id="expenseList"></ul>

</div>
</main>
<nav class="bottom-nav">

   <button id="settingsNavBtn" class="nav-item">
        <i data-lucide="home"></i>
        <span>Home</span>
    </button>
<button id="debtsBtn" class="nav-item">
    <i data-lucide="hand-coins"></i>
    <span>Debts</span>
</button>
   <button id="addMenuBtn" class="fab-nav">
    <i data-lucide="plus"></i>
</button>
<div id="fabMenu" class="fab-menu">

    <button id="fabIncome">
        <i data-lucide="trending-up"></i>
        <span>Income</span>
    </button>

    <button id="fabExpense">
        <i data-lucide="trending-down"></i>
        <span>Expense</span>
    </button>

    <button id="fabTransfer">
        <i data-lucide="repeat"></i>
        <span>Transfer</span>
    </button>

</div>

<button id="accountsBtn" class="nav-item">
    <i data-lucide="wallet"></i>
    <span>Accounts</span>
</button>

    <button id="settingsBtn" class="nav-item">
    <i data-lucide="settings"></i>
    <span>Settings</span>
</button>

</nav>
<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script src="js/theme.js"></script>
<script src="js/search.js"></script>
<script src="js/statistics.js"></script>
<script src="js/script.js"></script>
<script>
    // تفعيل رسم أيقونات Lucide بعد تحميل الصفحة
    document.addEventListener("DOMContentLoaded", function () {
        if (window.lucide) {
            lucide.createIcons();
        }
    });
</script>
</body>
</html>
