<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Income Card Redesign</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #10b981;
      --primary-bg: #ecfdf5;
      --border: #f1f5f9;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 400px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding: 0 4px;
      direction: ltr;
    }

    .title {
      font-size: 26px;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.5px;
    }

    .badge {
      background-color: #f1f5f9;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.08);
    }

    .left-side {
      display: flex;
      align-items: center;
      gap: 14px;
      direction: ltr;
    }

    .icon-box {
      width: 46px;
      height: 46px;
      background-color: var(--primary-bg);
      color: var(--primary);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-align: left;
    }

    .item-name {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-main);
    }

    .item-note {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
      direction: rtl;
      text-align: right;
    }

    .amount-tag {
      direction: ltr;
      display: flex;
      align-items: baseline;
      gap: 4px;
      background: #f8fafc;
      padding: 8px 14px;
      border-radius: 12px;
      border: 1px solid #f1f5f9;
    }

    .currency {
      font-size: 12px;
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
    }

    .value {
      font-size: 18px;
      font-weight: 800;
      color: var(--text-main);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h2 class="title">Income</h2>
      <span class="badge">1</span>
    </div>

    <div class="card">
      <div class="left-side">
        <div class="icon-box">💰</div>
        <div class="info">
          <span class="item-name">Salary</span>
          <span class="item-note">قبض</span>
        </div>
      </div>

      <div class="amount-tag">
        <span class="currency">EGP</span>
        <span class="value">100</span>
      </div>
    </div>
  </div>

</body>
</html>
